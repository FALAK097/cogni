name: cogni

services:
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/app/.data/cogni.db
    command: ["node", "scripts/migrate.mjs"]
    volumes:
      - sqlite_data:/app/.data
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: file:/app/.data/cogni.db
      UPLOAD_STORAGE: local
      NODE_ENV: production
      CLOUDFLARE_INGESTION_QUEUE_URL: ""
      INGESTION_SHARED_SECRET: ""
      INGESTION_RECLAIM_STALE: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - sqlite_data:/app/.data
      - uploads_data:/app/.uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ingestion-worker:
    image: curlimages/curl:8.12.1
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
          curl --fail --silent --show-error
          --header "Authorization: Bearer $${CRON_SECRET}"
          http://app:3000/api/cron/ingestion >/dev/null || true;
          sleep 30;
        done
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:
